<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunset Circuit · Raffi & Tigran</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap');

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Outfit', system-ui, sans-serif;
  background: #08040E;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.page { position: relative; min-height: 100vh; isolation: isolate; }
.page-haze {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,176,80,0.08), transparent 60%),
    linear-gradient(180deg, transparent 0%, rgba(8,4,14,0.5) 50%, rgba(8,4,14,0.95) 90%);
  z-index: 1; pointer-events: none;
}
.page-grid {
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 80px, rgba(255,255,255,0.015) 80px 81px),
    repeating-linear-gradient(90deg, transparent 0 80px, rgba(255,255,255,0.015) 80px 81px);
  z-index: 1; pointer-events: none;
}
.page-content {
  position: relative; z-index: 2;
  max-width: 1480px; margin: 0 auto;
  padding: 22px 28px 40px;
  display: flex; flex-direction: column; gap: 20px;
}

/* topbar */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; flex-wrap: wrap; padding: 16px 22px;
  background: linear-gradient(135deg, rgba(20,8,32,0.85), rgba(40,16,60,0.65));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; backdrop-filter: blur(14px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
}
.topbar-brand { display: flex; align-items: center; gap: 14px; }
.brand-mark { filter: drop-shadow(0 4px 12px rgba(255,210,63,0.4)); }
.brand-title {
  font-family: 'Russo One', sans-serif; font-size: 28px; letter-spacing: 0.08em;
  background: linear-gradient(180deg, #fff 0%, #FFD23F 70%, #FF8855 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1;
}
.brand-sub {
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; color: rgba(255,210,63,0.7); margin-top: 5px;
}
.topbar-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.tb-btn {
  font-family: 'Russo One', sans-serif; font-size: 12px; letter-spacing: 0.1em;
  padding: 9px 14px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
  color: rgba(255,255,255,0.9); cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; transition: all 0.15s;
}
.tb-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,210,63,0.4); color: #fff; }
.tb-btn.on { background: rgba(255,210,63,0.1); border-color: rgba(255,210,63,0.4); color: #FFD23F; }
.tb-btn.admin-on { background: linear-gradient(135deg, #FFD23F, #FF8855); color: #08040E; border-color: transparent; box-shadow: 0 4px 16px rgba(255,210,63,0.4); }
.tb-btn.warn { background: rgba(255,26,48,0.1); border-color: rgba(255,26,48,0.4); color: #FF4A60; }
.tb-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
.tb-dot.live { background: #6BCB55; box-shadow: 0 0 10px #6BCB55; animation: pulse 1.4s infinite; }

@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }

/* standings */
.standings {
  background: linear-gradient(135deg, rgba(20,8,32,0.92), rgba(50,18,72,0.85));
  border: 1px solid rgba(255,210,63,0.25);
  border-radius: 18px; padding: 18px 22px;
  backdrop-filter: blur(10px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
}
.standings-header { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
.standings-title { font-family: 'Russo One', sans-serif; font-size: 16px; letter-spacing: 0.18em; color: #FFD23F; text-shadow: 0 0 16px rgba(255,210,63,0.5); }
.standings-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stand-row {
  display: flex; align-items: center; gap: 12px;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)),
    linear-gradient(90deg, var(--kc), var(--kd) 90%);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px; padding: 10px 14px; position: relative;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.stand-row.lead { border-color: #FFD23F; box-shadow: 0 0 0 1.5px #FFD23F, 0 12px 36px rgba(255,210,63,0.25); }
.stand-pos { font-family: 'Russo One', sans-serif; font-size: 22px; color: #FFD23F; text-shadow: 0 2px 0 rgba(0,0,0,0.5); min-width: 38px; }
.stand-name-block { flex: 1; }
.stand-name { font-family: 'Russo One', sans-serif; font-size: 18px; letter-spacing: 0.04em; line-height: 1; }
.stand-car { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: rgba(255,255,255,0.65); margin-top: 3px; }
.stand-stat {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px;
  background: rgba(0,0,0,0.5); padding: 5px 11px; border-radius: 999px;
}
.stand-stat b { font-size: 16px; color: #FFD23F; }
.stand-stat .stat-unit { font-size: 10px; color: rgba(255,255,255,0.5); margin-left: 1px; }
.stand-crown {
  position: absolute; top: -10px; right: 14px;
  background: linear-gradient(135deg, #FFD23F, #FF8855); color: #08040E;
  font-family: 'Russo One', sans-serif; font-size: 10px; letter-spacing: 0.12em;
  padding: 3px 10px; border-radius: 999px;
  box-shadow: 0 4px 12px rgba(255,210,63,0.5);
  animation: bobble 2.2s ease-in-out infinite;
}
.stand-crown.tied { background: linear-gradient(135deg, #9BF6FF, #2EC4B6); animation: none; }
@keyframes bobble {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-3px) rotate(3deg); }
}

/* lane */
.lanes { display: flex; flex-direction: column; gap: 18px; }
.lane {
  background: linear-gradient(180deg, rgba(20,8,32,0.85), rgba(15,5,25,0.92));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px; overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
}
.lane-banner {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 28px; position: relative; overflow: hidden;
  border-bottom: 2px solid rgba(0,0,0,0.5);
  min-height: 200px; gap: 20px;
}
.lane-banner-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 40%, var(--kc) 0%, var(--kd) 45%, rgba(8,4,14,0.85) 90%);
  z-index: 0;
}
.lane-banner-bg::before {
  content: ''; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(45deg, transparent 0 24px, rgba(255,255,255,0.025) 24px 26px),
    radial-gradient(ellipse at 70% 50%, rgba(0,0,0,0.5), transparent 70%);
}
.lane-driver { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }
.driver-num {
  font-family: 'Russo One', sans-serif; font-size: 64px; letter-spacing: -0.02em;
  color: rgba(255,255,255,0.12);
  text-shadow: -2px -2px 0 rgba(255,255,255,0.18), 2px 2px 0 rgba(0,0,0,0.4);
  line-height: 1; font-style: italic;
}
.driver-info { flex: 1; }
.driver-tag {
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  font-size: 11px; letter-spacing: 0.22em; color: var(--ka);
  background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 4px;
  display: inline-block; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.08);
}
.driver-name {
  font-family: 'Russo One', sans-serif; font-size: 44px; letter-spacing: 0.04em;
  line-height: 0.95; color: #fff; font-style: italic;
  text-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.4);
  margin-bottom: 12px;
}
.driver-stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat-pill {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 12px; letter-spacing: 0.06em;
  background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12);
  padding: 5px 11px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 5px; color: #fff;
}
.stat-unit { font-size: 10px; color: rgba(255,255,255,0.5); margin-left: 1px; }
.stat-stage { font-family: 'Russo One', sans-serif; font-size: 11px; letter-spacing: 0.15em; }
.stat-stage.stage-0 { color: rgba(255,255,255,0.65); }
.stat-stage.stage-1 { background: linear-gradient(135deg, #FFD23F, #FF8855); color: #08040E; border-color: transparent; }
.stat-stage.stage-2 {
  background: linear-gradient(135deg, #FFD23F, #FF1A30); color: #fff; border-color: transparent;
  animation: maxedShine 2s ease-in-out infinite;
}
@keyframes maxedShine {
  0%, 100% { box-shadow: 0 0 0 rgba(255,210,63,0.4); }
  50% { box-shadow: 0 0 16px rgba(255,210,63,0.6); }
}
.stat-goal { color: rgba(255,255,255,0.85); }
.stat-goal.achieved { background: linear-gradient(135deg, #6BCB55, #38A867); color: #fff; border-color: transparent; }

.lane-car {
  position: relative; z-index: 1;
  filter: drop-shadow(0 16px 28px rgba(0,0,0,0.7));
  animation: hover 4.5s ease-in-out infinite;
}
@keyframes hover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* track */
.lane-track {
  position: relative; padding: 18px 28px 14px;
  background: linear-gradient(180deg, rgba(8,4,14,0.95), rgba(15,8,25,0.95));
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.track-tape {
  position: relative; height: 60px;
  background: linear-gradient(180deg, #1a1a1c 0%, #0a0a0c 50%, #050505 100%);
  border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.7), inset 0 -1px 0 rgba(255,255,255,0.03);
}
.track-tape-line {
  position: absolute; top: 50%; left: 0; right: 60px;
  height: 3px;
  background: repeating-linear-gradient(90deg, #FFD23F 0 28px, transparent 28px 52px);
  transform: translateY(-50%); opacity: 0.55;
}
.track-tape-finish {
  position: absolute; top: 0; bottom: 0; right: 0; width: 30px;
  background-image: linear-gradient(45deg, #fff 25%, #000 25%, #000 50%, #fff 50%, #fff 75%, #000 75%);
  background-size: 12px 12px; border-radius: 0 4px 4px 0;
}
.track-pos {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 3; transition: left 0.7s cubic-bezier(.34,1.56,.64,1);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
  display: flex; flex-direction: column; align-items: center;
}
.track-pos-label {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 10px; letter-spacing: 0.1em; color: #FFD23F;
  margin-top: -2px; background: rgba(0,0,0,0.7);
  padding: 1px 6px; border-radius: 3px; border: 1px solid rgba(255,210,63,0.3);
}
.track-meta {
  display: flex; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  font-size: 9px; letter-spacing: 0.18em; color: rgba(255,255,255,0.4);
  margin-top: 12px; padding: 0 4px;
}

/* sticker shelf */
.sticker-shelf {
  padding: 14px 28px 16px;
  background: linear-gradient(180deg, rgba(20,8,32,0.4), rgba(8,4,14,0.55));
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.sticker-shelf-tag {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 10px; letter-spacing: 0.22em;
  color: rgba(255,210,63,0.7);
  margin-bottom: 10px;
}
.sticker-row {
  display: flex; flex-wrap: wrap; gap: 10px;
  align-items: center;
}
.sticker {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 14px 9px 12px;
  border-radius: 999px;
  font-family: 'Russo One', sans-serif;
  font-size: 13px; letter-spacing: 0.08em;
  background: var(--sg, linear-gradient(135deg, #444, #222));
  color: var(--st, #fff);
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  font-style: italic;
}
.sticker:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.3); }
.sticker:disabled { cursor: default; }
.sticker.ghost {
  background: transparent;
  color: rgba(255,255,255,0.5);
  border: 1.5px dashed rgba(255,255,255,0.25);
  box-shadow: none;
  font-style: normal;
}
.sticker.ghost:hover:not(:disabled) {
  border-color: rgba(255,210,63,0.6);
  color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.04);
}
.sticker-icon { font-size: 18px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
.sticker-label { line-height: 1; }
.sticker-count {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 12px; letter-spacing: 0.04em;
  background: rgba(0,0,0,0.45);
  color: #fff;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.2);
  margin-left: 2px;
}
.sticker-minus {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  font-family: 'Russo One', sans-serif; font-size: 16px; line-height: 1;
  background: rgba(0,0,0,0.55); color: #fff;
  border-radius: 50%;
  margin-left: 4px;
  border: 1px solid rgba(255,255,255,0.25);
  cursor: pointer;
  transition: background 0.12s, transform 0.12s;
}
.sticker-minus:hover { background: #FF1A30; transform: scale(1.1); }

/* month + chore pane */
.lane-month { padding: 18px 22px 22px; background: rgba(0,0,0,0.2); }
.cal-pane { width: 100%; }
.cal-head {
  display: grid; grid-template-columns: repeat(7, 110px); gap: 6px;
  justify-content: center;
  margin-bottom: 8px;
}
.cal-dow {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 10px; letter-spacing: 0.18em;
  color: rgba(255,255,255,0.45);
  text-align: center; padding: 4px 0;
}
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 110px); gap: 6px;
  justify-content: center;
}
.cal-cell {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(255,255,255,0.28);
  border-radius: 10px; cursor: pointer; padding: 10px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
  transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  font-family: inherit;
  color: rgba(255,255,255,0.85);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.cal-cell.empty { background: transparent; border: none; cursor: default; box-shadow: none; }
.cal-cell:hover:not(.empty) {
  background: rgba(255,210,63,0.12);
  border-color: #FFD23F;
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 8px 20px rgba(255,210,63,0.28), 0 0 0 1px rgba(255,210,63,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
  z-index: 2;
}
.cal-cell.some { border-color: var(--kc); background: linear-gradient(135deg, rgba(255,255,255,0.04), color-mix(in oklab, var(--kc) 12%, transparent)); }
.cal-cell.full {
  background: linear-gradient(135deg, color-mix(in oklab, #FFD23F 30%, transparent), color-mix(in oklab, var(--kc) 30%, transparent));
  border-color: #FFD23F;
  box-shadow: 0 4px 12px rgba(255,210,63,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
  color: #fff;
}
.cal-cell.today { box-shadow: 0 0 0 2px #FF1A30, 0 4px 12px rgba(255,26,48,0.35); }
.cal-cell.full.today { box-shadow: 0 0 0 2px #FFD23F, 0 4px 16px rgba(255,210,63,0.5); }
.cal-cell.selected { box-shadow: 0 0 0 2px #9BF6FF, 0 4px 12px rgba(155,246,255,0.35); }
.cal-cell.full.selected { box-shadow: 0 0 0 2px #9BF6FF, 0 0 0 4px rgba(255,210,63,0.4), 0 4px 16px rgba(155,246,255,0.4); }
.cal-cell-num {
  font-family: 'Russo One', sans-serif; font-size: 22px;
  font-style: italic; letter-spacing: 0.02em; line-height: 1;
}
.cal-cell-pts {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 10px; color: #FFD23F;
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 4px;
}
.cal-cell-flag {
  position: absolute; bottom: 4px; right: 4px;
  font-size: 14px;
  filter: drop-shadow(0 0 4px rgba(255,210,63,0.6));
}
.cal-cell-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: rgba(0,0,0,0.4); border-radius: 0 0 7px 7px; overflow: hidden;
}
.cal-cell-fill {
  height: 100%; background: linear-gradient(90deg, var(--kc), #FFD23F);
}
.cal-cell-now {
  position: absolute; top: 4px; right: 4px;
  font-family: 'JetBrains Mono', monospace; font-weight: 800;
  font-size: 7px; letter-spacing: 0.1em;
  background: #FF1A30; color: #fff;
  padding: 1px 4px; border-radius: 3px;
  animation: pulse 1.4s infinite;
}

/* quick popover */
.quick-pop-backdrop {
  position: fixed; inset: 0;
  background: rgba(8,4,14,0.45);
  backdrop-filter: blur(2px);
  z-index: 90;
  animation: fadein 0.15s ease;
}
.quick-pop {
  position: fixed;
  width: 340px; max-width: calc(100vw - 24px);
  max-height: min(460px, calc(100vh - 24px));
  z-index: 100;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #1a0a2e 0%, #0a0414 100%);
  border: 1px solid rgba(255,210,63,0.4);
  border-radius: 16px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04), 0 0 60px rgba(255,210,63,0.15);
  animation: popIn 0.18s cubic-bezier(.34,1.56,.64,1);
}
.quick-pop > .quick-pop-head,
.quick-pop > .quick-pop-actions { padding: 12px 14px; flex-shrink: 0; }
.quick-pop > .quick-pop-head { padding-bottom: 10px; }
@keyframes popIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.quick-pop-arrow {
  position: absolute;
  left: var(--arrow-left, 50%); transform: translateX(-50%) rotate(45deg);
  width: 14px; height: 14px;
  background: #1a0a2e;
}
.quick-pop-below .quick-pop-arrow {
  top: -7px;
  border-left: 1px solid rgba(255,210,63,0.4);
  border-top: 1px solid rgba(255,210,63,0.4);
}
.quick-pop-above .quick-pop-arrow {
  bottom: -7px;
  border-right: 1px solid rgba(255,210,63,0.4);
  border-bottom: 1px solid rgba(255,210,63,0.4);
}
.quick-pop-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.quick-pop-tag { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 9px; letter-spacing: 0.2em; color: rgba(255,210,63,0.7); }
.quick-pop-name { font-family: 'Russo One', sans-serif; font-size: 18px; letter-spacing: 0.05em; line-height: 1; margin-top: 4px; text-shadow: 0 0 12px currentColor; }
.quick-pop-score { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: #FFD23F; display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(255,210,63,0.3); }

.quick-pop-scroll {
  flex: 1 1 auto;
  overflow-y: auto; overflow-x: hidden;
  padding: 10px 14px;
  scrollbar-width: thin; scrollbar-color: rgba(255,210,63,0.4) transparent;
}
.quick-pop-scroll::-webkit-scrollbar { width: 6px; }
.quick-pop-scroll::-webkit-scrollbar-thumb { background: rgba(255,210,63,0.4); border-radius: 3px; }
.quick-pop-scroll::-webkit-scrollbar-track { background: transparent; }

.quick-pop-grid { display: flex; flex-direction: column; gap: 5px; }

.quick-chip:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,210,63,0.4); }

/* burst */
.burst { position: fixed; z-index: 9999; pointer-events: none; transform: translate(-50%, -50%); }
.burst-ring {
  position: absolute; width: 80px; height: 80px;
  border: 3px solid var(--c); border-radius: 50%;

}
@keyframes burstRing { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.8); opacity: 0; } }
.burst-star { position: absolute; left: -28px; top: -28px; animation: burstStar 0.9s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes burstStar {
  0% { transform: scale(0) rotate(-180deg); }

.burst-emoji {

  35% { transform: scale(1.6) rotate(-10deg); opacity: 1; }

}

.modal-input.err { border-color: #FF1A30; animation: shake 0.4s; }
@keyframes shake {

@media (max-width: 1100px) {

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ─── Data ──────────────────────────────────────────────────────────────────────

const CHORES = [
  { id: "teeth",    label: "Brush teeth / wash face",      icon: "🪥", points: 1 },
  { id: "exercise", label: "Exercise",                      icon: "💪", points: 1 },
  { id: "listen",   label: "Listen the first time",         icon: "👂", points: 2 },
  { id: "brother",  label: "Be a good brother",             icon: "🤝", points: 1 },
  { id: "plates",   label: "Put plates away",               icon: "🍽", points: 1 },
  { id: "room",     label: "Clean room / toys away",        icon: "🧸", points: 1 },
  { id: "outside",  label: "Stuff away after coming in",    icon: "🎒", points: 1 },
];

const KIDS = [
  { id: "raffi",  name: "RAFFI",  num: "01", color: "#FF1A30", colorDark: "#7A0512", accent: "#FFD23F", car: "Stallion GT" },
  { id: "tigran", name: "TIGRAN", num: "02", color: "#2EC4B6", colorDark: "#063532", accent: "#9BF6FF", car: "Aerion V12" },
];

const STICKERS = [
  { id: "hardworker", label: "HARD WORKER", icon: "💪", grad: "linear-gradient(135deg, #FFD23F, #FF8855)",  tone: "#08040E" },
  { id: "brainpower", label: "BRAIN POWER", icon: "🧠", grad: "linear-gradient(135deg, #9BF6FF, #2EC4B6)",  tone: "#08040E" },
  { id: "discipline", label: "DISCIPLINE",  icon: "⚡", grad: "linear-gradient(135deg, #FF6A7A, #FF1A30)",  tone: "#fff"    },
  { id: "newrecord",  label: "NEW RECORD",  icon: "🏆", grad: "linear-gradient(135deg, #FFFAD0, #FFB060)",  tone: "#08040E" },
  { id: "diaper",     label: "DIAPER",      icon: "👶", grad: "linear-gradient(135deg, #FFCFE4, #FF99CC)",  tone: "#5A0A2A" },
];

const MONTHLY_GOAL = 100;
const MAX_DAILY = CHORES.reduce((s, c) => s + c.points, 0); // 8

function buildMonth() {
  const year = 2026, month = 4; // May
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDow = (first.getDay() + 6) % 7; // Mon = 0
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  return { cells, daysInMonth, year, month, startDow };
}

const MONTH = buildMonth();
const MONTH_NAME = "MAY 2026";

function getTodayDay() {
  const now = new Date();
  if (now.getFullYear() === 2026 && now.getMonth() === 4) return now.getDate();
  return null;
}
const TODAY_DAY = getTodayDay();

const STORAGE_KEY = "kidcal:v4";

function emptyStickers() {
  const out = {};
  for (const k of KIDS) {
    out[k.id] = {};
    for (const s of STICKERS) out[k.id][s.id] = 0;
  }
  return out;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (!s.stickers) s.stickers = emptyStickers();
      // backfill missing kids/stickers from older saves
      for (const k of KIDS) {
        if (!s.stickers[k.id]) s.stickers[k.id] = {};
        for (const st of STICKERS) {
          if (typeof s.stickers[k.id][st.id] !== "number") s.stickers[k.id][st.id] = 0;
        }
      }
      return s;
    }
  } catch (e) {}
  const empty = { stars: {}, stickers: emptyStickers() };
  for (const k of KIDS) {
    empty.stars[k.id] = {};
    for (let d = 1; d <= MONTH.daysInMonth; d++) {
      empty.stars[k.id][d] = {};
      for (const c of CHORES) empty.stars[k.id][d][c.id] = false;
    }
  }
  return empty;
}

function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
}

// ─── Audio ─────────────────────────────────────────────────────────────────────

let audioCtx;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}

let _clickBuf = null;
let _clickBufLoading = false;
let _activeClickSrc = null;

function preloadClickSound() {
  if (_clickBuf || _clickBufLoading) return;
  const ctx = getCtx(); if (!ctx) return;
  _clickBufLoading = true;
  fetch("drive-by.wav")
    .then(r => r.arrayBuffer())
    .then(ab => ctx.decodeAudioData(ab))
    .then(buf => { _clickBuf = buf; })
    .catch(() => {})
    .finally(() => { _clickBufLoading = false; });
}

function playWoosh() {
  const ctx = getCtx(); if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume();
  if (!_clickBuf) {
    preloadClickSound();
    const start = Date.now();
    const wait = setInterval(() => {
      if (_clickBuf) { clearInterval(wait); _playClickBuf(); }
      else if (Date.now() - start > 2000) clearInterval(wait);
    }, 30);
    return;
  }
  _playClickBuf();
}

function _playClickBuf() {
  const ctx = getCtx(); if (!ctx || !_clickBuf) return;
  if (_activeClickSrc) { try { _activeClickSrc.stop(); } catch (e) {} _activeClickSrc = null; }
  const src = ctx.createBufferSource();
  src.buffer = _clickBuf;
  const g = ctx.createGain();
  g.gain.value = 0.85;
  const t = ctx.currentTime;
  const capDur = Math.min(1.5, _clickBuf.duration);
  g.gain.setValueAtTime(0.85, t + Math.max(0, capDur - 0.15));
  g.gain.linearRampToValueAtTime(0.0001, t + capDur);
  src.connect(g).connect(ctx.destination);
  src.start(t);
  src.stop(t + capDur + 0.02);
  _activeClickSrc = src;
  src.onended = () => { if (_activeClickSrc === src) _activeClickSrc = null; };
}

function playRev() {
  const ctx = getCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(70, now);
  osc.frequency.linearRampToValueAtTime(220, now + 0.25);
  osc.frequency.linearRampToValueAtTime(140, now + 0.65);
  filter.type = "lowpass"; filter.frequency.setValueAtTime(900, now); filter.Q.value = 6;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.13, now + 0.05);
  gain.gain.linearRampToValueAtTime(0.09, now + 0.4);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
  osc.connect(filter).connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.8);
}

// ─── Helpers ───────────────────────────────────────────────────────────────────

function carStageMonthly(pts) {
  if (pts >= 70) return 2;
  if (pts >= 35) return 1;
  return 0;
}

function pointsForDay(state, kidId, day) {
  let p = 0;
  for (const c of CHORES) if (state.stars[kidId][day]?.[c.id]) p += c.points;
  return p;
}

function totalPoints(state, kidId) {
  let p = 0;
  for (let d = 1; d <= MONTH.daysInMonth; d++) p += pointsForDay(state, kidId, d);
  return p;
}

function fullDays(state, kidId) {
  let n = 0;
  for (let d = 1; d <= MONTH.daysInMonth; d++) if (pointsForDay(state, kidId, d) === MAX_DAILY) n++;
  return n;
}

// ─── SVG Components ────────────────────────────────────────────────────────────

function HeroCar({ src, width = 400, accent, stars = 0 }) {
  const stage = carStageMonthly(stars);
  const stageLabel = ["STOCK", "TUNED", "MAXED"][stage];
  return (
    <div style={{
      position: "relative", width, aspectRatio: "1 / 1", borderRadius: "22px",
      overflow: "hidden",
      background: "radial-gradient(ellipse at 50% 60%, rgba(255,255,255,0.08), transparent 65%), linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.7))",
      boxShadow: "0 24px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08)",
      border: "1px solid rgba(255,255,255,0.08)",
    }}>
      <img src={src} alt="race car" draggable={false} style={{
        position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover",
        filter: stage === 0 ? "saturate(0.92) brightness(0.96)"
               : stage === 1 ? "saturate(1.1) brightness(1.02) contrast(1.04)"
               : "saturate(1.2) brightness(1.05) contrast(1.08)",
      }} />
      {stage >= 1 && (
        <div style={{
          position: "absolute", inset: 0,
          background: `radial-gradient(circle at 80% 30%, ${accent}40, transparent 55%), radial-gradient(circle at 20% 90%, rgba(0,0,0,0.6), transparent 55%)`,
          mixBlendMode: "screen", pointerEvents: "none",
        }} />
      )}
      {stage === 2 && (
        <>
          <div style={{
            position: "absolute", inset: 0, border: `2px solid ${accent}`,
            borderRadius: "22px",
            boxShadow: `inset 0 0 32px ${accent}55, 0 0 32px ${accent}66`,
            pointerEvents: "none", animation: "maxedShine 2s ease-in-out infinite",
          }} />
          <div style={{
            position: "absolute", top: 10, right: 12,
            fontFamily: "'Russo One', sans-serif", fontSize: 11, letterSpacing: "0.18em",
            padding: "4px 10px", borderRadius: 999,
            background: "linear-gradient(135deg, #FFD23F, #FF1A30)", color: "#fff",
            boxShadow: "0 4px 14px rgba(255,210,63,0.4)",
          }}>⚡ MAXED</div>
        </>
      )}
      {stage < 2 && (
        <div style={{
          position: "absolute", top: 10, right: 12,
          fontFamily: "'Russo One', sans-serif", fontSize: 10, letterSpacing: "0.18em",
          padding: "4px 9px", borderRadius: 999,
          background: stage === 1 ? "linear-gradient(135deg, #FFD23F, #FF8855)" : "rgba(0,0,0,0.55)",
          color: stage === 1 ? "#08040E" : "rgba(255,255,255,0.85)",
          border: stage === 1 ? "none" : "1px solid rgba(255,255,255,0.12)",
        }}>{stageLabel}</div>
      )}
    </div>
  );
}

function RaffiCar({ stars = 0, width = 360 }) {
  return <HeroCar src="assets/raffi-car.png" width={width} accent="#FF1A30" stars={stars} />;
}

function TigranCar({ stars = 0, width = 360 }) {
  return <HeroCar src="assets/tigran-car.png" width={width} accent="#2EC4B6" stars={stars} />;
}

function ChromeStar({ size = 32, lit = true, glint = false }) {
  if (!lit) {
    return (
      <svg viewBox="0 0 100 100" width={size} height={size}>
        <polygon points="50,12 61,40 92,42 67,62 76,92 50,75 24,92 33,62 8,42 39,40"
          fill="#1a1620" stroke="#0a0610" strokeWidth="1.5" opacity="0.6" />
      </svg>
    );
  }
  return (
    <svg viewBox="0 0 100 100" width={size} height={size} style={{ overflow: "visible" }}>
      <defs>
        <linearGradient id={`sg-${size}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stopColor="#FFFAD0" />
          <stop offset="35%"  stopColor="#FFD23F" />
          <stop offset="75%"  stopColor="#D88800" />
          <stop offset="100%" stopColor="#7A4A00" />
        </linearGradient>
      </defs>
      {glint && (
        <circle cx="50" cy="50" r="48" fill="#FFD23F" opacity="0.3">
          <animate attributeName="r" values="40;55;40" dur="1.2s" repeatCount="indefinite" />
        </circle>
      )}
      <polygon points="50,16 61,42 90,44 67,62 76,90 50,75 24,90 33,62 10,44 39,42"
        fill="#000" opacity="0.4" transform="translate(2,3)" />
      <polygon points="50,12 61,40 92,42 67,62 76,92 50,75 24,92 33,62 8,42 39,40"
        fill={`url(#sg-${size})`} stroke="#5A3500" strokeWidth="1.2" />
      <polygon points="50,12 61,40 50,50 39,40" fill="#fff" opacity="0.5" />
      <polygon points="50,50 39,40 8,42 33,62" fill="#000" opacity="0.15" />
      <polygon points="50,50 67,62 76,92 50,75" fill="#000" opacity="0.22" />
      <ellipse cx="42" cy="32" rx="6" ry="3" fill="#fff" opacity="0.55" />
    </svg>
  );
}

function HelmetAvatar({ kid, size = 56 }) {
  const isRaffi = kid === "raffi";
  const base   = isRaffi ? "#E63946" : "#2EC4B6";
  const dark   = isRaffi ? "#5A0A14" : "#063532";
  const stripe = isRaffi ? "#FFD23F" : "#9BF6FF";
  return (
    <svg viewBox="0 0 100 100" width={size} height={size}>
      <defs>
        <linearGradient id={`helm-${kid}`} x1="0" y1="0" x2="0" y2="1">

function Checker({ width = 80, height = 14 }) {
  const cells = 16;
  const cellW = width / cells;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height}>
      {Array.from({ length: cells * 2 }).map((_, i) => {
        const row = Math.floor(i / cells);
        const col = i % cells;
        const black = (row + col) % 2 === 0;
        return (
          <rect key={i}
            x={col * cellW} y={row * (height / 2)}
            width={cellW} height={height / 2}
            fill={black ? "#0a0610" : "#fff"} />
        );
      })}
    </svg>
  );
}

function QuickChorePopover({ kid, day, anchorRect, state, onToggle, onAddAll, onClearDay, onClose }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(() => computePos(anchorRect));

  function computePos(rect) {
    if (!rect) return { left: window.innerWidth / 2 - 170, top: 80, placement: "below", arrowLeft: 170 };
    const W = 340;
    const H = Math.min(460, window.innerHeight - 24);
    const margin = 12;
    const cellCenterX = rect.left + rect.width / 2;
    let left = cellCenterX - W / 2;
    left = Math.max(margin, Math.min(window.innerWidth - W - margin, left));
    let placement = "below";
    let top = rect.bottom + 10;
    const spaceBelow = window.innerHeight - top - margin;
    const spaceAbove = rect.top - margin - 10;
    if (spaceBelow < H && spaceAbove > spaceBelow) {
      placement = "above";
      top = Math.max(margin, rect.top - 10 - H);
    }
    const arrowLeft = Math.max(20, Math.min(W - 20, cellCenterX - left));
    return { left, top, placement, arrowLeft, height: H };
  }

  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) onClose(); }
    function onEsc(e) { if (e.key === "Escape") onClose(); }
    function onResize() { setPos(computePos(anchorRect)); }
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onEsc);
    window.addEventListener("resize", onResize);
    window.addEventListener("scroll", onResize, true);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onEsc);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("scroll", onResize, true);
    };
  }, [onClose, anchorRect]);

  const dayPts = pointsForDay(state, kid.id, day);

  return ReactDOM.createPortal(
    <>
      <div className="quick-pop-backdrop" onClick={onClose} />
      <div
        className={`quick-pop quick-pop-${pos.placement}`}
        ref={ref}
        style={{ left: pos.left, top: pos.top, maxHeight: pos.height, "--arrow-left": `${pos.arrowLeft}px` }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="quick-pop-arrow" />
        <div className="quick-pop-head">
          <div>
            <div className="quick-pop-tag">DAY {day}</div>
            <div className="quick-pop-name" style={{ color: kid.color }}>{kid.name}</div>
          </div>
          <div className="quick-pop-score"><ChromeStar size={16} lit /> {dayPts}/{MAX_DAILY}</div>
        </div>
        <div className="quick-pop-scroll">
          <div className="quick-pop-grid">
            {CHORES.map((c) => {
              const checked = state.stars[kid.id][day]?.[c.id];
              return (
                <button
                  key={c.id}
                  className={`quick-chip ${checked ? "on" : ""} ${c.points === 2 ? "double" : ""}`}
                  onClick={(e) => onToggle(kid.id, day, c.id, c.points, e)}
                  title={c.label}
                >
                  <span className="quick-chip-icon">{c.icon}</span>
                  <span className="quick-chip-label">{c.label}</span>
                  {c.points === 2 && <span className="quick-chip-2x">2×</span>}
                </button>
              );
            })}
          </div>
        </div>
        <div className="quick-pop-actions">
          <button className="quick-act add"   onClick={onAddAll}>★ ADD ALL</button>
          <button className="quick-act clear" onClick={onClearDay}>↻ CLEAR DAY</button>
          <button className="quick-act close" onClick={onClose}>CLOSE</button>
        </div>
      </div>
    </>,
    document.body
  );
}

  if (visible.length === 0 && !adminMode) return null;
  return (
    <div className="sticker-shelf">

            key={s.id}
            className={`sticker ${s.count > 0 ? "owned" : "ghost"}`}

            onClick={(e) => adminMode && onAward(kid.id, s.id, e)}

        ))}
      </div>
    </div>
  );
}

function Standings({ state }) {
  const totals = {};
  for (const k of KIDS) totals[k.id] = totalPoints(state, k.id);
  const sorted = [...KIDS].sort((a, b) => totals[b.id] - totals[a.id]);
  const tied   = totals[sorted[0].id] === totals[sorted[1].id];
  return (
    <div className="standings">
      <div className="standings-header">
        <Checker width={120} height={10} />
        <div className="standings-title">▸ {MONTH_NAME} CHAMPIONSHIP</div>
        <Checker width={120} height={10} />

      <div className="standings-rows">
        {sorted.map((kid, i) => {
          const isLead = !tied && i === 0;
          return (
            <div key={kid.id} className={`stand-row ${isLead ? "lead" : ""}`}
              style={{ "--kc": kid.color, "--kd": kid.colorDark }}>
              <div className="stand-pos">{tied ? "=" : `P${i + 1}`}</div>
              <HelmetAvatar kid={kid.id} size={42} />

              <div className="stand-stat">🏁 <b>{fullDays(state, kid.id)}</b></div>
              {isLead && <div className="stand-crown">👑 LEADER</div>}
              {tied && i === 0 && <div className="stand-crown tied">⚡ TIED</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── App ───────────────────────────────────────────────────────────────────────

function App() {
  const [state,       setState]      = useState(loadState);
  const [adminMode,   setAdminMode]  = useState(false);
  const [soundOn,     setSoundOn]    = useState(true);
  const [bursts,      setBursts]     = useState([]);
  const [showPin,     setShowPin]    = useState(false);
  const [pin,         setPin]        = useState("");
  const [pinErr,      setPinErr]     = useState(false);
  const [selectedDay, setSelectedDay] = useState(TODAY_DAY || 1);
  const [popover,     setPopover]    = useState(null);

  function openPopover(kidId, day, rect) { setPopover({ kidId, day, rect }); }
  function closePopover() { setPopover(null); }

  // ─── Firestore sync ─────────────────────────────────────────────────────────
  // Normalize remote payload so older docs (no stickers field) don't blow up.
  function normalizeRemote(remote) {
    const out = { stars: remote.stars || {}, stickers: remote.stickers || {} };
    for (const k of KIDS) {
      if (!out.stickers[k.id]) out.stickers[k.id] = {};
      for (const s of STICKERS) {
        if (typeof out.stickers[k.id][s.id] !== "number") out.stickers[k.id][s.id] = 0;
      }
      if (!out.stars[k.id]) out.stars[k.id] = {};
      for (let d = 1; d <= MONTH.daysInMonth; d++) {
        if (!out.stars[k.id][d]) out.stars[k.id][d] = {};
        for (const c of CHORES) {
          if (typeof out.stars[k.id][d][c.id] !== "boolean") out.stars[k.id][d][c.id] = false;
        }
      }
    }
    return out;
  }

  const skipNextSave = useRef(false);
  const hasInitialSync = useRef(false); // true once we've heard from Firestore
  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; }, [state]);

  // Subscribe to remote changes (also performs initial load)
  useEffect(() => {
    const unsub = window.__stateDoc.onSnapshot(snap => {
      if (!snap.exists) {
        // No remote doc yet — seed it with current local state, then unblock saves.
        window.__stateDoc.set(stateRef.current).catch(() => {});
        hasInitialSync.current = true;
        return;
      }
      const remote = normalizeRemote(snap.data() || {});
      hasInitialSync.current = true;
      if (JSON.stringify(remote) === JSON.stringify(stateRef.current)) return;
      skipNextSave.current = true;
      setState(remote);
    }, () => {});
    return () => unsub();
  }, []);

  // Save on every change: local cache + debounced remote write
  const remoteSaveTimer = useRef(null);
  useEffect(() => {
    saveState(state);
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (!hasInitialSync.current) return; // CRITICAL: don't overwrite remote until we've read it
    if (remoteSaveTimer.current) clearTimeout(remoteSaveTimer.current);
    remoteSaveTimer.current = setTimeout(() => {
      window.__stateDoc.set(state).catch(() => {});
    }, 250);
  }, [state]);

  function addBurst(x, y, color, big, emoji) {
    const id = Date.now() + Math.random();
    setBursts(b => [...b, { id, x, y, color, big, emoji }]);
    setTimeout(() => setBursts(b => b.filter(x => x.id !== id)), 900);
  }

  function toggle(kidId, day, choreId, points, e) {
    if (!adminMode) return;
    const wasChecked = state.stars[kidId][day][choreId];
    setState(prev => ({
      ...prev,
      stars: {
        ...prev.stars,
        [kidId]: { ...prev.stars[kidId], [day]: { ...prev.stars[kidId][day], [choreId]: !wasChecked } },
      },
    }));
    if (!wasChecked && e) {
      const r = e.currentTarget.getBoundingClientRect();
      const k = KIDS.find(x => x.id === kidId);
      const chore = CHORES.find(c => c.id === choreId);
      addBurst(r.left + r.width / 2, r.top + r.height / 2, k.color, points === 2, chore?.icon);
      if (soundOn) {
        playWoosh();
        const newTotal = totalPoints(state, kidId) + points;
        if (newTotal >= MONTHLY_GOAL && totalPoints(state, kidId) < MONTHLY_GOAL) setTimeout(playRev, 200);
      }
    }
  }

  function addAllDay(kidId, day) {
    if (!adminMode) return;
    setState(prev => {
      const dayMap = { ...prev.stars[kidId][day] };
      for (const c of CHORES) dayMap[c.id] = true;
      return { ...prev, stars: { ...prev.stars, [kidId]: { ...prev.stars[kidId], [day]: dayMap } } };
    });
    const k = KIDS.find(x => x.id === kidId);
    const cellEl = document.querySelector(`[data-cell="${kidId}-${day}"]`);
    let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    if (cellEl) {
      const r = cellEl.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    }
    CHORES.forEach((c, i) => {
      setTimeout(() => addBurst(cx + (Math.random() - 0.5) * 40, cy + (Math.random() - 0.5) * 30, k.color, c.points === 2, c.icon), i * 70);
    });
    if (soundOn) { playWoosh(); setTimeout(playRev, 200); }
  }

  function clearDay(kidId, day) {
    if (!adminMode) return;
    setState(prev => {
      const dayMap = {};
      for (const c of CHORES) dayMap[c.id] = false;
      return { ...prev, stars: { ...prev.stars, [kidId]: { ...prev.stars[kidId], [day]: dayMap } } };
    });
  }

  function awardSticker(kidId, stickerId, e) {
    if (!adminMode) return;
    setState(prev => ({
      ...prev,
      stickers: {
        ...prev.stickers,
        [kidId]: {
          ...prev.stickers[kidId],
          [stickerId]: (prev.stickers[kidId]?.[stickerId] || 0) + 1,
        },
      },
    }));
    if (e) {
      const r = e.currentTarget.getBoundingClientRect();
      const k = KIDS.find(x => x.id === kidId);
      const sticker = STICKERS.find(s => s.id === stickerId);
      addBurst(r.left + r.width / 2, r.top + r.height / 2, k.color, true, sticker?.icon);
      if (soundOn) playWoosh();
    }
  }

  function removeSticker(kidId, stickerId) {
    if (!adminMode) return;
    setState(prev => ({
      ...prev,
      stickers: {
        ...prev.stickers,
        [kidId]: {
          ...prev.stickers[kidId],
          [stickerId]: Math.max(0, (prev.stickers[kidId]?.[stickerId] || 0) - 1),
        },
      },
    }));
  }

  function tryAdmin() {
    if (adminMode) setAdminMode(false);
    else { setShowPin(true); setPin(""); setPinErr(false); }
  }

  function submitPin() {
    if (pin === "0702") { setAdminMode(true); setShowPin(false); }
    else { setPinErr(true); setPin(""); }
  }

  function resetMonth() {
    if (!confirm("Clear ALL stars for this month? Both kids, every day. (Stickers stay.)")) return;
    setState(prev => {
      const empty = { stars: {}, stickers: prev.stickers || emptyStickers() };
      for (const k of KIDS) {
        empty.stars[k.id] = {};
        for (let d = 1; d <= MONTH.daysInMonth; d++) {
          empty.stars[k.id][d] = {};
          for (const c of CHORES) empty.stars[k.id][d][c.id] = false;
        }
      }
      return empty;
    });
  }

  return (
    <div className="page">
      <SunsetBg />
      <div className="page-haze" />
      <div className="page-grid" />

      <div className="page-content">
        <header className="topbar">
          <div className="topbar-brand">
            <div className="brand-mark"><ChromeStar size={42} lit /></div>
            <div className="brand-text">
              <div className="brand-title">SUNSET CIRCUIT</div>
              <div className="brand-sub">CHORE GRAND PRIX · {MONTH_NAME} · GOAL 100</div>
            </div>
          </div>
          <div className="topbar-controls">
            <button className={`tb-btn ${soundOn ? "on" : ""}`} onClick={() => setSoundOn(s => !s)}>
              {soundOn ? "🔊 SOUND" : "🔇 MUTED"}
            </button>
            <button className={`tb-btn ${adminMode ? "admin-on" : ""}`} onClick={tryAdmin}>
              <span className={`tb-dot ${adminMode ? "live" : ""}`} />
              {adminMode ? "PIT CREW" : "DRIVER VIEW"}
            </button>
            {adminMode && <button className="tb-btn warn" onClick={resetMonth}>↻ CLEAR ALL STARS</button>}
          </div>
        </header>

        <Standings state={state} />

        <main className="lanes">
          {KIDS.map(kid => (
            <KidLane
              key={kid.id}
              kid={kid}
              state={state}
              onToggle={toggle}
              onAddAllDay={addAllDay}
              onClearDay={clearDay}
              onAwardSticker={awardSticker}
              onRemoveSticker={removeSticker}
              adminMode={adminMode}
              selectedDay={selectedDay}
              setSelectedDay={setSelectedDay}
              popover={popover}
              openPopover={openPopover}
              closePopover={closePopover}
            />
          ))}
        </main>

        <footer className="footer">
          <div className="footer-legend">
            <span className="leg-item"><ChromeStar size={18} lit /> 1 PT · CHORE</span>
            <span className="leg-item">⚡ 2 PTS · LISTEN FIRST TIME</span>
            <span className="leg-item">🏁 PERFECT DAY · 8 PTS</span>
            <span className="leg-item">🎯 MONTHLY GOAL · 100 PTS</span>
          </div>
          <div className="footer-hint">
            {adminMode
              ? "Tap a day on the calendar to award chores"
              : "Switch to Pit Crew to award points"}
          </div>
        </footer>
      </div>

      {bursts.map(b => <StarBurst key={b.id} {...b} />)}

      {showPin && (
        <div className="modal-bg" onClick={() => setShowPin(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-title">🔒 PIT CREW ACCESS</div>
            <div className="modal-sub">Enter 4-digit code to award points</div>
            <input
              autoFocus type="password" inputMode="numeric" maxLength={4}
              value={pin}
              onChange={e => { setPin(e.target.value); setPinErr(false); }}
              onKeyDown={e => e.key === "Enter" && submitPin()}
              className={`modal-input ${pinErr ? "err" : ""}`}
              placeholder="••••"
            />
            {pinErr && <div className="modal-err">Wrong code</div>}
            <div className="modal-actions">
              <button className="modal-cancel" onClick={() => setShowPin(false)}>Cancel</button>
              <button className="modal-go" onClick={submitPin}>Unlock</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Kick off audio preload on first user gesture
window.addEventListener("pointerdown", function _firstTap() {
  window.removeEventListener("pointerdown", _firstTap);
  try { preloadClickSound(); } catch (e) {}
}, { once: true });

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
